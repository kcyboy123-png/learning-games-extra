<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ece4d3"><title>너와 나의 하루 · 교감 모드</title><link rel="stylesheet" href="style.css">
<body><canvas id="scene" aria-label="거실의 강아지. 눌러서 인사할 수 있어요." role="button" tabindex="0"></canvas>
<header><div><h1>너와 나의 하루</h1><button id="dayline" type="button" aria-label="이름 부르기">우리의 작은 시작</button></div><nav><button id="camera" aria-label="사진 찍기"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="3"/><path d="M8 7l2-4h4l2 4"/><circle cx="12" cy="14" r="4"/></svg><span class="nav-label">사진</span></button><button id="album" aria-label="추억 앨범"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="19" rx="2"/><path d="M8 3v19M11 8h6M11 12h6M11 16h4"/></svg><span class="nav-label">추억</span></button><button id="menu" aria-label="메뉴"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="nav-label">메뉴</span></button></nav></header>
<p id="speech" role="status" aria-live="polite"></p><button id="offer" type="button" hidden></button><p id="saveError" role="alert" hidden></p><p id="loading">햇살을 들이는 중…</p>
<section id="welcome" class="paper" hidden><p class="eyebrow">처음 만나는 우리의 친구</p><h2>천천히 친해져도 좋아.</h2><p>매일 조금씩 자라고, 함께한 순간을 기억해요.<br>며칠 쉬었다 와도 반갑게 만나요.</p><button id="choosePet" type="button" class="soft">친구 선택 · <span id="petKind"></span></button><form id="adopt"><label for="petName">어떤 이름으로 불러 줄까요?</label><div class="name-row"><input id="petName" maxlength="12" value="모아" autocomplete="off" required><button class="primary" id="start" disabled>함께하기</button></div></form><a class="classic" href="classic/">기존 펫키우기 · 4종 동물</a></section>
<footer><div id="actions" aria-label="함께 할 일"></div><button id="queued" type="button" aria-live="polite" hidden></button><small id="hint">펫을 가볍게 눌러 인사해 보세요.</small></footer>
<dialog id="panel"><button id="closePanel" class="close" aria-label="닫기">×</button><div id="panelBody"></div></dialog>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>
<script type="module" src="app.mjs"></script></body></html>
