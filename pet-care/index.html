/* 지난 시간을 한 번에 반영. lastCalc를 올려 같은 구간을 두 번 계산하지 않는다. */
/* [from,to] 구간에서 수면 시간(h). 시간 경계 단위로 합산 (최대 45일 → 1,080구간). 초 단위 루프 아님. */
function sleepHours(from,to,sl){let sh=0,a=from;while(a<to){const d=new Date(a),nextH=new Date(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours()+1).getTime(),b=Math.min(nextH,to);if(sl(d.getHours()))sh+=(b-a)/H;a=b;}return sh;}
/* 휴식: 잠/깸 구간을 시간 경계 순서대로 밟으며 구간마다 clamp. 접속 중 매분 계산한 결과와 오프라인 한 번 계산이 같아진다(구간 안에서는 부호가 일정하므로). */
function restAfter(v,from,to,r,sl){let a=from;while(a<to){const d=new Date(a),nextH=new Date(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours()+1).getTime(),b=Math.min(nextH,to),seg=(b-a)/H;v=clamp(sl(d.getHours())?v+2*r*seg:v-r*seg);a=b;}return v;}
function isResting(t=now()){return t>=(S.awakeUntil||0)&&(sp().sleep(new Date(t).getHours())||t<(S.restUntil||0));}

function weekStart(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d.getTime();}
function sitterRemaining(t=now()){return Math.max(0,5-(S.sitterUses||[]).filter(x=>x>=weekStart(t)&&x<=t).length);}
function startSitter(hours){advance();if(S.trial||S.sitter||S.careTask||!Number.isFinite(hours)||hours<1||hours>24||sitterRemaining()===0)return false;const t=now(),before=JSON.parse(JSON.stringify(S));S.sitterUses=(S.sitterUses||[]).filter(x=>x>=weekStart(t));S.sitterUses.push(t);S.sitter={start:t,end:t+hours*H};S.restUntil=0;log(`${hours}시간 이웃에게 돌봄을 맡겼어요`);if(!save()){Object.assign(S,before);return false;}return true;}

// Children's overnight protection is a game accommodation, not an animal feeding rule.
function careSlowHours(from,to,sl){return sleepHours(from,to,h=>h>=22||h<7||sl(h));}
function advance(){
 const t=now(),wall=Date.now();
 if(S.trial){S.lastCalc=t;if(S.careTask&&wall>=S.careTask.end)completeCareTask(wall,t);return;}
 if(t<=S.lastCalc){if(S.careTask&&wall>=S.careTask.end)completeCareTask(wall,S.lastCalc);return;}
 const from=Math.max(S.lastCalc,t-45*DAY),sp_=sp(),task=S.careTask,shift=S.offset||0;
 const careStart=task?task.start+shift:Infinity,careEnd=task?task.end+shift:Infinity;
 if(task&&wall>=task.end&&careEnd<=from){if(!completeCareTask(wall,from))return;}
 const points=[...new Set([from,t,...[S.sitter?.start,S.sitter?.end,S.restUntil,S.awakeUntil,careStart,careEnd].filter(x=>Number.isFinite(x)&&x>from&&x<t)])].sort((a,b)=>a-b);
 for(let i=1;i<points.length;i++){
  const a=points[i-1],b=points[i],h=(b-a)/H,careCovered=S.careTask&&a>=careStart&&a<careEnd,covered=S.sitter&&a>=S.sitter.start&&a<S.sitter.end;
  if(careCovered){S.lastMess=b;/* Game accommodation: staff maintain needs during treatment. */}
  else if(covered){S.stat.sitterH+=h;for(const k in S.n)S.n[k]=Math.max(SITTER_FLOOR,S.n[k]-sp_.needs[k][1]*h*.3);S.mess=false;S.lastMess=b;}
  else {const sl=a<(S.awakeUntil||0)?()=>false:a<(S.restUntil||0)?()=>true:sp_.sleep;for(const k in S.n){let r=sp_.needs[k][1];if(k==='temp'&&S.heater)r=0;if(k==='rest'){S.n[k]=restAfter(S.n[k],a,b,r,sl);continue;}const hours=(k==='food'||k==='water')&&S.kind!=='fish'?h-.75*careSlowHours(a,b,sl):h;S.n[k]=clamp(S.n[k]-r*hours);}
   if(sp_.messEvery&&b-S.lastMess>sp_.messEvery*H&&S.n.food>20)S.mess=true;
   if(S.protect||h>=PROTECT_H){S.protect=true;for(const k in S.n)S.n[k]=Math.max(PROTECT_FLOOR,S.n[k]);S.mess=false;}
  }
  // Persist each processed boundary so a failed completion save cannot replay elapsed decay.
  S.lastCalc=b;
  if(S.careTask&&b>=careEnd&&wall>=S.careTask.end){if(!completeCareTask(wall,b))return;}
 }
 if(S.sitter&&t>=S.sitter.end)S.sitter=null;if(S.restUntil&&t>=S.restUntil)S.restUntil=0;
 const low=Object.entries(S.n).filter(([k,v])=>k!=='coat'&&v<15).length;if(!S.careTask&&low>=2&&!S.sick)S.sick=true;S.lastCalc=t;
}

function enter(){pose='idle';poseT=0;N.pose='in';N.x=null;$('mission').hidden=!S.trial;$('intro').hidden=true;D.x=null;$('pet').className='';$('pet').innerHTML='';for(const id of['stage','top','panel'])$(id).hidden=false;$('acts').dataset.k='';lastDraw='';if(S.trial)trialSetup();render();const gap=now()-S.lastSave;if(gap>H&&!S.trial)setTimeout(()=>say(gap>DAY?`${Math.floor(gap/DAY)}일 만이에요! 그동안 잘 지냈어요.`:'다시 왔네요! 반가워요.',4000),600);}
/* Inline after existing helpers. Real deadlines use Date.now(), never the game's test offset. */
const CARE_DURATION={vet:H,bath:H/2};
function validateCareTask(task,kind,wall=Date.now(),trial=false){
 if(task==null)return null;
 if(!task||typeof task!=='object'||!Object.hasOwn(CARE_DURATION,task.kind)||task.kind==='bath'&&kind!=='dog')return undefined;
 if(!Number.isFinite(task.start)||!Number.isFinite(task.end)||task.start<new Date(2020,0,1).getTime()||task.start>wall+2*DAY||task.end-task.start!==(trial?20000:CARE_DURATION[task.kind]))return undefined;
 return {kind:task.kind,start:task.start,end:task.end};
}
function restoreCareSnapshot(before){for(const key of Object.keys(S))if(!Object.hasOwn(before,key))delete S[key];Object.assign(S,before);}
function startCareTask(kind){
 advance();
 if(!Object.hasOwn(CARE_DURATION,kind)||S.careTask)return false;
 if(S.sitter||isResting()){say('돌봄을 맡겼거나 쉬고 있어요. 깨어난 뒤에 시작해 주세요.');return false;}
 if(kind==='vet'&&!S.sick){say('지금은 건강해 보여요. 아플 때 진료를 부탁해요.');return false;}
 if(kind==='bath'&&(S.kind!=='dog'||now()-S.lastBath<14*DAY||!((S.n.coat??100)<50))){say('강아지 목욕은 게임에서 2주가 지났고 몸이 더러울 때 시작해요. 실제 주기는 전문가 안내를 따라요.');return false;}
 const before=JSON.parse(JSON.stringify(S)),wall=Date.now();
 S.careTask={kind,start:wall,end:wall+(S.trial?20000:CARE_DURATION[kind])};S.restUntil=0;S.scene='room';
 log(S.trial?'수업 체험: 20초 돌봄을 시작했어요':kind==='vet'?'1시간 진료를 시작했어요':'30분 목욕과 말리기를 시작했어요');
 if(!save()){restoreCareSnapshot(before);return false;}
 say(S.trial?'수업 체험은 20초로 줄여 경험해요. 실제 입양 모드는 진료 1시간·목욕 30분이에요.':kind==='vet'?'실제 시간으로 1시간 동안 진료받아요. 접속을 꺼도 시간이 흘러요.':'실제 시간으로 30분 동안 씻고 말려요. 접속을 꺼도 시간이 흘러요.');return true;
}
/* Called at the simulation deadline before normal post-treatment decay. Return false on save failure. */
function completeCareTask(wall=Date.now(),simEnd=now()){
 const task=S.careTask;if(!task||wall<task.end)return false;
 const before=JSON.parse(JSON.stringify(S));S.careTask=null;
 if(task.kind==='vet'){S.sick=false;S.stat.vet++;for(const k in S.n)S.n[k]=Math.max(50,S.n[k]);log('진료를 마치고 돌아왔어요');aff(3);}
 else {S.lastBath=task.end+(S.offset||0);S.n.coat=100;S.stat.bath++;log('목욕과 말리기를 마쳤어요');aff(2);}
 // House dirt is not removed by washing the animal. The coat, not its toilet, becomes clean.
 S.lastCalc=simEnd;
 trialCheck(task.kind,true);
 if(!save()){restoreCareSnapshot(before);return false;}
 return true;
}

function careTaskReason(k){if(S.sitter)return '이웃 돌봄을 마친 뒤에 시작해 주세요.';if(isResting())return '지금은 쉬고 있어요. 깨어난 뒤에 시작해 주세요.';if(k==='vet'&&!S.sick)return '현재 진료가 필요한 상태는 아니에요.';if(k==='bath'&&(S.kind!=='dog'||now()-S.lastBath<14*DAY||!((S.n.coat??100)<50)))return bathEvidence();return ''; }
function propArt(i){return detailSprite(DETAIL.props,i,'assets/detail/props.png');}

function healthEvidence(){const labels=Object.entries(S.n).filter(([k,v])=>k!=='coat'&&v<35).map(([k])=>sp().needs[k][0]);return S.sick?`기운이 없고 생활 상태가 나빠졌어요.${labels.length?' 살펴볼 부분: '+labels.join(' · '):' 진료 후 회복을 도와주세요.'}`:labels.length?`${labels.join(' · ')} 상태를 먼저 돌봐 주세요. 아직 병원 치료가 필요한 단계는 아니에요.`:'지금은 건강하게 지내고 있어요.';}
function bathEvidence(){if(S.kind!=='dog')return '이 동물에게 강아지 목욕을 적용하지 않아요. 필요한 털 손질과 보금자리 청소를 해 주세요.';const days=Math.max(0,Math.floor((now()-S.lastBath)/DAY));return `마지막 목욕 후 ${days}일 · 털 상태 ${Math.round(S.n.coat)}. `+(days<14?'게임에서는 목욕 간격 14일을 지켜요. 먼저 빗질과 집 청소를 해 주세요.':S.n.coat<50?'털 상태가 나빠져 목욕을 고려할 때예요. 집이 더러운 것과는 별개예요.':'아직 깨끗해요. 날짜가 됐다고 억지로 씻기지 않아요.');}
const BOND_STEPS=[[0,'처음 만난 사이','냄새와 목소리에 익숙해지는 중이에요.'],[10,'익숙한 목소리','이름을 부르면 고개를 들어요.'],[25,'편안한 친구','곁에서 긴장을 풀고 인사해요.'],[40,'기다리는 친구','돌봄과 놀이 시간을 알아봐요.'],[60,'믿음직한 보호자','곁에서 편안히 쉬는 모습이 늘어요.'],[80,'서로 믿는 단짝','자기 방식으로 반가움과 편안함을 표현해요.']];

function showBond(){resetBondLife();const b=bondStage(),next=BOND_STEPS.find(x=>x[0]>S.aff);sheet(`<h2>${esc(S.name)}와 ${b[1]}</h2><p>${b[2]}</p><p>알맞은 먹이와 물, 필요한 청소, 편안한 놀이가 조금씩 믿음을 쌓아요. 쉬거나 싫어할 때 기다려 주는 것도 돌봄이에요.</p><div class="bond-path">${BOND_STEPS.map(x=>`<div class="${S.aff>=x[0]?'reached':''}"><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div><p>${next?'다음 모습: '+next[1]:'지금처럼 꾸준히 함께해요.'}</p><h3>우리만의 실제 발견</h3>${S.found.map(x=>`<p>♡ ${esc(x)}</p>`).join('')||'<p>아직 낯설어요. 작은 돌봄부터 시작해요.</p>'}<small>친밀도는 게임 속 표현이에요. 실제 동물의 애착 속도와 반응은 각자 달라요.</small>`);}
function requestCare(k){if(!S)return;resetBondLife();advance();if(S.careTask)return openLongCare();if(careSession)return;
 if(k==='feed'&&isResting())return showRest();
 if(!hasArt()||!['feed','water','clean','play','vet','bath'].includes(k))return doAct(k);
 if(S.sitter)return say('이웃이 돌보는 중이에요. 먼저 직접 돌보기로 돌아와 주세요.');
 if(k==='vet'||k==='bath'){const reason=careTaskReason(k);if(reason)return sheet(`<h2>${k==='vet'?'건강 확인':'목욕 판단'}</h2><p>${esc(reason)}</p><p>${k==='vet'?healthEvidence():bathEvidence()}</p>`);return confirmCare(k);}
 if(k==='play'&&(isResting()||S.n.rest<20||S.protect))return doAct(k);
 if(k==='feed'){const win=inWin(sp().meals),key=win?new Date(now()).toLocaleDateString('en-CA')+'-'+win[0]:null;if(S.kind==='rabbit'?S.n.food>90:!win?S.n.food>=40:S.lastMeal[key]||S.n.food>85)return doAct(k);}
 if(k==='water'&&S.n.water>90)return doAct(k);
 if(k==='clean'&&!S.mess&&(S.n.clean??S.n.litter??S.n.bed)>85)return doAct(k);

function confirmCare(k){const isVet=k==='vet';sheet(`<h2>${isVet?'동물병원에 갈까요?':'따뜻하게 목욕할까요?'}</h2><p>${isVet?healthEvidence():bathEvidence()}</p><p><b>${S.trial?'수업 체험은 20초':isVet?'실제 1시간':'실제 30분'}이 걸립니다. 실행하겠어요?</b></p><p>${S.trial?'수업에서는 짧게 체험해요. 실제 입양 모드는 진료 1시간·목욕 30분이에요.':'창을 닫아도 시간이 흘러요.'} ${isVet?'진료와 휴식을 마친 뒤 건강이 회복돼요.':'씻기·헹구기·말리기를 마친 뒤 털과 몸이 깨끗해져요.'} 이 시간은 게임 연출이며 실제 진료·목욕 시간의 기준은 아니에요.</p><button class="btn go" id="careConfirm">${isVet?'진료 시작':'목욕 시작'}</button>`);$('careConfirm').onclick=()=>{if(!startCareTask(k))return say('시작하지 못했어요. 상태와 저장 공간을 확인해 주세요.');$('sheet').hidden=true;openLongCare();render();};}
function playActionLabel(){return S.kind==='cat'?'깃털 장난감 움직이기':S.kind==='rabbit'?'놀이 자리 가리키기':'공 던지기';}
function shortInstruction(k){return {feed:S.kind==='rabbit'?'신선한 건초를 천천히 먹는 모습을 지켜봐요.':'서두르지 않고 오물오물 먹는 모습을 지켜봐요.',water:'물그릇을 눌러 비우기 → 헹구기 → 새 물 채우기.',clean:'표시된 더러운 곳을 손가락으로 문지르거나 눌러 치워 주세요.',play:S.kind==='cat'?'바닥 가까이 깃털 장난감을 움직여요. 따라잡으면 잠깐 쉬어요.':S.kind==='rabbit'?'안전한 바닥의 놀이 자리를 가리켜요. 스스로 다가오도록 기다려요.':'바닥을 눌러 공을 던져요. 친구가 따라간 뒤 다시 던져 주세요.'}[k];}
function startShortCare(k){careSession={kind:k,owner:S,simStart:now(),start:Date.now(),end:Date.now()+CARE_SECONDS[k]*1000,steps:0,busyUntil:0,cleaned:[],startAff:S.aff};$('sheet').hidden=true;openCareScene(k);}
function scenePet(state='idle'){return detailArt(S.kind,dogGrowth(),state);}
function openCareScene(k){const long=k==='vet'||k==='bath',o=$('careScene');o.hidden=false;o.dataset.kind=k;o.innerHTML=`<div class="care-view ${long?'care-special':''}" id="careView" aria-label="${k==='clean'?'직접 닦는 공간':k==='play'?'함께 노는 공간':'돌봄 공간'}"><div class="care-pet" id="carePet">${scenePet(long?'sleep':k==='feed'&&!isResting()?'eat':isResting()?'sleep':'idle')}</div>${k==='feed'||k==='water'?`<div class="care-bowl" id="careBowl">${propArt(k==='water'?3:S.kind==='rabbit'?4:0)}</div>`:''}${k==='clean'?[0,1,2,3].map((n)=>`<button class="dirty-spot" data-spot="${n}" style="left:${[25,65,38,73][n]}%;top:${[58,65,79,46][n]}%" aria-label="더러운 곳 ${n+1} 닦기"><span>${S.kind==='cat'||S.kind==='rabbit'?'젖은 모래':S.kind==='ham'?'젖은 깔짚':'얼룩'}</span></button>`).join(''):''}${k==='play'?'<button id="careBall" aria-label="공 던지기" class="care-ball"></button>':''}<div class="care-foam" id="careFoam" hidden></div></div><div class="care-caption"><span class="care-eyebrow">${esc(S.name)}와 함께하는 시간</span><h2>${{feed:'천천히, 맛있게',water:'맑은 물 한 그릇',clean:'보송보송 우리 집',play:S.kind==='cat'?'살금살금, 깃털을 따라':S.kind==='rabbit'?'스스로 폴짝, 안전한 놀이터':'내가 던지면, 네가 따라와',vet:'포근한 동물병원',bath:'따뜻한 목욕과 말리기'}[k]}</h2><p id="careInstruction">${long?'':shortInstruction(k)}</p><progress id="careProgress" max="100" value="0" aria-label="돌봄 진행"></progress><p id="careTime" role="status" aria-live="polite"></p><div class="more">${k==='water'?'<button class="btn go" id="waterStep">묵은 물 비우기</button>':''}${k==='play'?'<button class="btn go" id="throwBall">공 던지기</button>':''}<button class="btn" id="careLeave">${long?'방으로 돌아가 기다리기':'이번 돌봄 취소'}</button></div><small>${long?'접속하지 않아도 종료 시각까지 진행됩니다.':'돌봄을 마쳐야 상태와 기록에 반영돼요.'}</small></div>`;
 $('careLeave').onclick=()=>{careSession=null;o.hidden=true;render();};
 if(k==='water'){$('waterStep').onclick=waterStep;const bowl=$('careBowl');bowl.style.pointerEvents='auto';bowl.style.cursor='pointer';bowl.setAttribute('role','button');bowl.setAttribute('tabindex','0');bowl.setAttribute('aria-label','물그릇 비우고 헹구고 채우기');bowl.onclick=waterStep;bowl.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();waterStep();}};}
 if(k==='clean')o.querySelectorAll('[data-spot]').forEach(b=>{const wipe=()=>{if(!careSession||careSession.cleaned.includes(b.dataset.spot))return;careSession.cleaned.push(b.dataset.spot);careSession.steps++;b.disabled=true;b.classList.add('cleaned');$('careInstruction').textContent=`${careSession.steps}/4곳을 깨끗하게 닦았어요.`;};b.onpointerdown=e=>{b.setPointerCapture?.(e.pointerId);wipe();};b.onpointermove=e=>{if(e.buttons)wipe();};b.onclick=wipe;});
 if(k==='play'){o.dataset.pet=S.kind;$('throwBall').textContent=playActionLabel();$('careBall').setAttribute('aria-label',playActionLabel());$('careBall').innerHTML=playToyArt(S.kind==='cat'?'feather':S.kind==='rabbit'?'willow':'ball');$('careView').onpointerdown=e=>{if(e.target.closest('.dirty-spot'))return;const r=$('careView').getBoundingClientRect();throwCareBall(clamp((e.clientX-r.left)/r.width*100,15,85),clamp((e.clientY-r.top)/r.height*100,45,80));};$('throwBall').onclick=()=>throwCareBall([25,75,40,65][(careSession?.steps||0)%4],65);$('careBall').onclick=e=>{if(e.detail===0)throwCareBall(70,60);};}
 if(k==='play'&&['cat','rabbit'].includes(S.kind))setupSpeciesPlay();

function waterStep(){const c=careSession;if(!c||c.kind!=='water'||Date.now()<c.busyUntil||c.steps>=4)return;c.steps++;c.busyUntil=Date.now()+(c.steps===3?8000:2000);const resting=isResting(c.simStart);$('waterStep').textContent=['','깨끗하게 헹구기','새 물 채우기',resting?'조용히 놓은 물그릇 확인':'마시는 모습 살펴보기','돌봄을 마치는 중'][c.steps];$('careBowl').innerHTML=propArt(c.steps>=3?2:3);$('careInstruction').textContent=['','묵은 물을 비웠어요. 그릇 바닥을 깨끗하게 헹궈요.','그릇을 헹궜어요. 새 물을 채워 주세요.',resting?'자고 있어요. 물은 곁에 두고 깨우지 않아요. 물그릇이 안정적으로 놓였는지 확인해요.':'코를 가까이 대더니 물을 조금씩 마셔요. 서두르지 않고 마실 공간을 지켜 주세요.',resting?'물은 준비됐어요. 잠든 친구를 깨우거나 마시게 하지 않았어요.':'깨끗한 물이 남아 있어요. 물그릇을 안정적인 자리에 두었어요.'][c.steps];if(c.steps===3){c.end=Math.max(c.end,Date.now()+8000);$('carePet').innerHTML=scenePet(resting?'sleep':'eat');}}

function throwCareBall(x,y){const c=careSession;if(!c||c.kind!=='play'||Date.now()<c.busyUntil)return;c.busyUntil=Date.now()+2800;c.steps++;const b=$('careBall'),p=$('carePet');b.style.left=x+'%';b.style.top=y+'%';p.style.left=x+'%';p.style.top=(y-5)+'%';p.innerHTML=scenePet('play');$('careInstruction').textContent=`${c.steps}번 함께 놀았어요. ${S.kind==='cat'?'깃털을 따라 살금살금!':S.kind==='rabbit'?'가고 싶은 곳으로 폴짝!':'공을 따라가는 중이에요!'}`;}
function finishShortCare(){const c=careSession;if(!c||S!==c.owner){careSession=null;return;}careSession=null;$('careScene').hidden=true;const ok=doAct(c.kind,c.simStart);pose='idle';poseT=0;render();if(ok)say(`함께 돌본 시간이 쌓였어요. ${bondStage()[1]}!`,3500);}

function adventureStep(){
 const a=enrichSession;if(!a||a.owner!==S)return;
 const story=adventureStory(),choices=adventureChoices(),familiar=enrichment().memories.some(m=>m.type==='friend');

 sheet(`<div class="together-sheet"><small class="enrich-eyebrow">작은 발견 ${a.step+1}/2</small><h2>${esc(ENRICH[S.kind].routes[a.route])}</h2>${enrichStage(`<span id="adventureObject" class="enrich-adventure-object" style="position:absolute;left:61%;top:44%;width:125px;z-index:2;transition:transform 2s,opacity 2s">${adventureObjectArt(story.object)}</span>${S.kind==='dog'&&a.route?'<span class="enrich-friend" style="right:'+(familiar?'10%':'3%')+'">'+detailArt('dog',Math.min(4,dogGrowth()+1),'idle')+'</span>':''}`,S.kind==='dog'?'park':'room')}<p id="enrichResponse" role="status">${esc(intro)}</p><div class="more">${choices.map((x,i)=>`<button class="btn" data-event="${i}">${esc(x)}</button>`).join('')}</div><button class="btn go" id="enrichFinish" hidden>${a.step===0?'다음 발견으로':'오늘의 추억 남기기'}</button><p class="enrich-note">동물이 다가오지 않아도 괜찮아요. 기다려 주는 것도 함께하는 방법이에요.</p></div>`);
 $('sheet').querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{
  if(a.end)return;a.choice=+b.dataset.event;a.end=Date.now()+8000;

function showDiscoveries(){if(!hasArt())return;const next=CUTE[S.kind].find(x=>x[1]>S.aff),g=dogGrowth(),l=life();enrichSheet(`<h2>기다릴수록 달라지는 우리</h2><p>${g<4?`다음 성장 모습은 ${g*6+7}일째 · 지금 ${enrichmentDay()}일째예요. 얼굴·귀·털과 몸의 비율이 달라져요.`:'다섯 번째 성장 모습까지 함께했어요. 계속 함께 돌보고 추억을 남길 수 있어요.'}</p><p>발견한 행동 ${l.seen.filter(x=>x.startsWith(S.kind+'-')).length}/8 · ${next?`친밀도 ${next[1]}부터 새로운 행동을 볼 수 있어요.`:'서로 믿는 단짝의 특별한 순간도 기다려 보세요.'}</p><div class="together-grid">${CUTE[S.kind].map((x,i)=>`<div class="together-card"><b>${l.seen.includes(S.kind+'-'+i)?esc(x[0]):S.aff>=x[1]?'아직 발견하지 못한 행동':'친밀도 '+x[1]+'에 열려요'}</b><small>${l.seen.includes(S.kind+'-'+i)?esc(x[2]):'편안하고 건강할 때 조용히 지켜보세요. 못 봐도 손해는 없어요.'}</small></div>`).join('')}</div><h3>넓어지는 활동 범위</h3>${ENRICH[S.kind].routes.map((x,i)=>`<p>${routeOpen(i)?'✓':'🔒'} ${esc(x)} ${routeOpen(i)?'· 함께 탐험할 수 있어요':routeRequirement(i)}</p>`).join('')}<button class="btn go" id="discoverAlbum">찍어 둔 사진 보기 (${l.photos.length})</button>`);$('discoverAlbum').onclick=showPhotoAlbum;}

async function photoLayer(svg){const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width','400');clone.setAttribute('height','400');for(const image of clone.querySelectorAll('image')){const response=await fetch(image.getAttribute('href'));if(!response.ok)throw Error('image');const blob=await response.blob(),data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob);});image.setAttribute('href',data);}const uri=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml'}));try{const im=new Image();await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=uri;});return im;}finally{URL.revokeObjectURL(uri);}}

async function takePetPhoto(){if(!S||!hasArt()||takingPhoto)return;if(life().photos.length>=12)return sheet('<h2>사진첩이 가득 찼어요</h2><p>12장을 안전하게 보관하고 있어요. 사진첩에서 내려받은 뒤 원하는 사진을 지우면 새 사진을 찍을 수 있어요.</p><button class="btn" id="openPhotos">사진첩 열기</button>'),$('openPhotos').onclick=showPhotoAlbum;
