<script id="device-guide-script">(()=>{
 'use strict';
 const key='device-orientation-tip-v1:'+document.title;
 const narrowLandscape=matchMedia('(orientation:landscape) and (max-height:500px) and (max-width:1000px)');
 let dismissed=false,shown=false;
 try{dismissed=sessionStorage.getItem(key)==='dismissed';}catch{}
 const tip=document.createElement('aside');tip.id='device-rotate-tip';tip.hidden=true;tip.setAttribute('aria-label','휴대폰 화면 방향 안내');
 tip.innerHTML='<p>휴대폰은 <strong>세로로</strong> 돌리면 더 편해요.<br>지금 방향으로 계속해도 괜찮아요.</p><button type="button" aria-label="화면 방향 안내 닫기">×</button>';
 document.body.append(tip);
 function dismiss(){dismissed=true;tip.hidden=true;try{sessionStorage.setItem(key,'dismissed');}catch{}}
 tip.querySelector('button').addEventListener('click',dismiss);
 function update(){if(dismissed)return;if(narrowLandscape.matches){tip.hidden=false;shown=true;}else if(shown)dismiss();}
 narrowLandscape.addEventListener('change',update);update();
})();
